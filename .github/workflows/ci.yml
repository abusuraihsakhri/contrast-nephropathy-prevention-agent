name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-test-only-audit-key

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"
          python -m pip check

      - name: Compile
        run: python -m compileall -q cin_guard.py contrast_nephropathy_prevention_agent agents enrichment.py cli.py

      - name: Check browser JavaScript
        run: node --check web/app.js

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: |
          contrast-nephropathy-prevention-agent audit --patient-id CI-SMOKE --weight 70 --age 65 --creatinine 1.2 --egfr 55 --contrast-volume 120
          python -c "from contrast_nephropathy_prevention_agent.server import app; assert any(r.path == '/api/evaluate' for r in app.routes)"

      - name: Legacy audit integrity smoke test
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity() is True"

      - name: Secret regression check
        run: |
          ! grep --line-number "contrast-nephropathy-prevention-engine-prod-audit-key-2026" docker-compose.yml Dockerfile pyproject.toml

      - name: Dependency and static security audit
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit bandit
          pip-audit
          bandit -q -r cin_guard.py contrast_nephropathy_prevention_agent

      - name: Docker smoke test
        if: matrix.python-version == '3.12'
        run: |
          docker build -t contrast-nephropathy-prevention-agent:ci .
          docker run -d --name caki-ci -p 8000:8000 contrast-nephropathy-prevention-agent:ci
          trap 'docker rm -f caki-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -H "Content-Type: application/json" -d @sample_payload.json http://127.0.0.1:8000/api/evaluate | python -m json.tool >/dev/null
