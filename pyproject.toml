[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contrast-nephropathy-prevention-engine"
version = "2.0.0"
description = "CIN-Guard: Contrast-Associated Acute Kidney Injury Risk & Hydration Protocol Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
contrast-nephropathy-prevention-engine = "contrast_nephropathy_prevention_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/contrast-nephropathy-prevention-engine"
Repository = "https://github.com/abusuraihsakhri/contrast-nephropathy-prevention-engine.git"
