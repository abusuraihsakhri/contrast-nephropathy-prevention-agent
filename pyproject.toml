[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contrast-nephropathy-prevention-agent"
version = "2.1.0"
description = "CA-AKI risk, contrast-dose, and hydration planning calculator for research and educational use."
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
contrast-nephropathy-prevention-agent = "contrast_nephropathy_prevention_agent.cli:main"

[project.urls]
Homepage = "https://abusuraihsakhri.github.io/contrast-nephropathy-prevention-agent/"
Repository = "https://github.com/abusuraihsakhri/contrast-nephropathy-prevention-agent"
Issues = "https://github.com/abusuraihsakhri/contrast-nephropathy-prevention-agent/issues"

[tool.setuptools]
py-modules = ["cin_guard"]

[tool.setuptools.packages.find]
include = ["contrast_nephropathy_prevention_agent*"]
